name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - name: Check out Yanami Sub
        uses: actions/checkout@v7

      - name: Read pinned FineSub source
        id: core
        shell: pwsh
        run: |
          $Core = Get-Content desktop/resources/core-source.json -Raw | ConvertFrom-Json
          if ($Core.commit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid FineSub commit pin.' }
          "repository=$($Core.repository)" >> $env:GITHUB_OUTPUT
          "commit=$($Core.commit)" >> $env:GITHUB_OUTPUT

      - name: Check out pinned FineSub
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.core.outputs.repository }}
          ref: ${{ steps.core.outputs.commit }}
          path: upstream
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          . ./desktop/scripts/source-tree.ps1
          Get-VerifiedCoreSource -RepoRoot $PWD -CoreRoot "$PWD/upstream" | Out-Null
          python -m pip install --upgrade pip
          python -m pip install -e ./upstream
          python -m pip install -e ".[desktop,dev]"

      - name: Run Python tests
        run: python -m pytest -q

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: desktop/frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: desktop/frontend
        run: npm test

      - name: Build frontend
        working-directory: desktop/frontend
        run: npm run build
